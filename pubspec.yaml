name: sensorbox
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.3

  # QR Scanner
  mobile_scanner: ^5.1.1

  # Charts for history
  fl_chart: ^0.69.0

  # Local notifications
  flutter_local_notifications: ^17.2.2

  # Date picker
  intl: ^0.19.0

  # Background notifications
  workmanager: ^0.9.0
  url_launcher: ^6.3.2
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/